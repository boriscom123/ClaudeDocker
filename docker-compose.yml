# Общий слой VPS: точка входа, общие данные, просмотр контейнеров.
#
# Правило владения: ресурс, нужный более чем одному проекту, описан здесь;
# нужный одному — в репозитории этого проекта. Compose самих проектов сюда
# не входит: у них свои файлы плюс оверлей под этот VPS в projects/.
#
#   docker compose up -d
#
# Требуются внешние сети (создаются один раз):
#   docker network create web claude-net shared-data
name: shared

services:
  # Единственная точка входа сервера: TLS, ACME и маршрутизация по доменам.
  # Версия зафиксирована намеренно: плавающий тег alpine делает сборку
  # невоспроизводимой — один и тот же файл давал бы разный образ в разное время.
  nginx:
    image: nginx:1.31.4-alpine
    ports:
      # Бинды (host:container) задаются в .env — порты в репозитории не светятся
      - "${HTTP_BIND}"
      - "${HTTPS_BIND}"
    environment:
      # Подставляются в шаблоны через envsubst при старте. OUTPUT_DIR
      # перенаправляет рендер в /etc/nginx с сохранением подкаталогов, FILTER
      # ограничивает подстановку нашими переменными — служебные переменные
      # nginx ($host, $uri, $document_root) остаются нетронутыми.
      - DOMAIN=${DOMAIN}
      - CM_DOMAIN=${CM_DOMAIN}
      - UQ_DOMAIN=${UQ_DOMAIN}
      - MP_DOMAIN=${MP_DOMAIN}
      - PORTAL_DOMAIN=${PORTAL_DOMAIN}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - NGINX_ENVSUBST_FILTER=^(DOMAIN|CM_DOMAIN|UQ_DOMAIN|MP_DOMAIN|PORTAL_DOMAIN)$$
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      # Только каталог public каждого проекта и строго по тому пути, который
      # видит его php-fpm: SCRIPT_FILENAME разворачивает php-fpm, а не nginx.
      # Репозитории целиком сюда не монтируются — иначе их .env оказались бы
      # внутри интернет-контейнера.
      - /home/boris/projects/game_world_tycoon_idle/public:/var/www/game:ro
      - /home/boris/projects/cross_messenger/public:/var/www/cm/public:ro
      - /home/boris/projects/uzbek_queue/public:/var/www/uq/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/boris/infra/acme:/var/www/acme:ro
    networks:
      # web — cm-php и uq-php; claude-net — devbot и myproject;
      # game — алиас `server` для /api и /socket.io.
      - web
      - claude-net
      - game
    restart: unless-stopped

  # Общая база: её используют game и uzbek_queue.
  # Мажорная версия меняется только через дамп и восстановление — формат
  # каталога данных между мажорами несовместим. Том 16-й версии сохранён
  # отдельно (game_world_tycoon_idle_postgres_data) как путь отката.
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # С 18-й версии образ ждёт ОДИН том на /var/lib/postgresql, а данные
      # кладёт в подкаталог версии (/var/lib/postgresql/18/docker). Монтирование
      # в /var/lib/postgresql/data, как было до 17-й включительно, приводит к
      # отказу старта.
      - postgres18_data:/var/lib/postgresql
    networks: [data]
    restart: unless-stopped

  # Общий кеш и очереди. Проекты обращаются по имени `redis` — алиас живёт
  # на сети shared-data, поэтому REDIS_HOST=redis в их .env менять не нужно.
  redis:
    image: redis:8.10-alpine
    volumes:
      - redis_data:/data
    networks: [data]
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "${PORTAINER_BIND}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  # Данные postgres 18 — свой том. Том 16-й версии
  # (game_world_tycoon_idle_postgres_data) намеренно не удалён: пока он цел,
  # откат к прежней версии — это смена image и имени тома обратно.
  postgres18_data:
  portainer_data:
    external: true
    name: game_world_tycoon_idle_portainer_data
  redis_data:

networks:
  web:
    external: true
  claude-net:
    external: true
  game:
    external: true
    name: game_world_tycoon_idle_default
  data:
    external: true
    name: shared-data
